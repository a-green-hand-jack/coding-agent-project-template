schema_version: 1
purpose: >-
  Record which development-plane content is reusable across repositories and
  which content belongs to one concrete project.
template:
  repository: https://github.com/a-green-hand-jack/coding-agent-project-template
  version: v0.1.21
  # A derived template (a template built from another template) records itself
  # above and the template it follows here; nobody else writes this block, and a
  # project made from a derived template removes it (DEV.md, template relationship):
  # upstream:
  #   repository: <URL of the template it was built from>
  #   version: <release tag of that template it follows>
# This repository's writing conventions (issue-workflow, "Writing
# conventions"). A project writes its own block or none; template-upgrade
# never changes it.
writing:
  language: 中文
  issue_sections: 最终目标, 实现哲学, 现状和问题, 怎么办, 验收, 不做
default_scope: project
matching: Most specific path wins; explicit entries override directory defaults.
classes:
  shared:
    meaning: Generic process that can be reused across projects.
    rule: Reuse only after checking adaptation notes and local tool availability.
  shared_with_adaptation:
    meaning: Reusable structure whose paths, commands or evidence must change.
    rule: >-
      Copy skills and memory records verbatim and write the destination's slot
      values and step additions only in their trailing `## In this repository`
      section (template-adoption step 5), so template-upgrade replaces the text
      above it; copy other files selectively and rewrite them for the
      destination project.
  project:
    meaning: Content about one project's product, environment or history.
    rule: Create independently; never copy the directory wholesale.
  template:
    meaning: Content that defines this template itself.
    rule: Keep in the template repository only.
entry_fields:
  optional: >-
    true: a project may leave the path out. template-adoption maps it as
    adopted or rejected, and template-upgrade keeps a rejected path out.
  upgrade: >-
    review: a file the project owns once it has started. template-upgrade
    never changes it and shows the release's change for review.
entries:
  - path: AGENTS.md
    scope: shared_with_adaptation
    note: Write destination-specific agent rules after using the template.
  - path: CLAUDE.md
    scope: shared
    kind: symlink-index
    note: Recreate as a relative symlink to AGENTS.md; never duplicate its content.
  - path: .agents/skills/shared/worktree-lifecycle/
    scope: shared_with_adaptation
    note: Adapt Herdr workspace names and project commands; retire only after background acceptance and outstanding obligations are fulfilled or explicitly transferred with acknowledgement, then stop owned processes, migrate and verify state/assets, and remove the worktree.
  - path: .agents/skills/shared/issue-workflow/
    scope: shared_with_adaptation
    note: Fill dispatch/lifecycle slots and align task-key, role and attempt names with returned IDs; the claimant owns dependency re-evaluation and delivery. Simple Issues target dev; a declared parent integration branch records child targets, final dev PR and acceptance obligations.
  - path: .agents/skills/shared/agent-communication/
    scope: shared
    note: Resolve native capabilities before choosing transport; distinguish submitted, acknowledged and completed. Herdr is a conditional fallback, never receipt proof by itself.
  - path: .agents/skills/shared/project-memory-governance/
    scope: shared
    note: Generic classification, registration and cleanup procedure.
  - path: .agents/skills/shared/cli-first-operations/
    scope: shared
    note: Use the project's public CLI instead of ad-hoc wrappers.
  - path: .agents/skills/shared/long-running-supervision/
    scope: shared_with_adaptation
    note: Adapt status, monitor, logs and checkpoint commands to the product.
  - path: .agents/skills/shared/template-feedback/
    scope: shared_with_adaptation
    note: Adapt the canonical template URL, labels and upstream Issue fields.
  - path: .agents/skills/shared/template-adoption/
    scope: shared_with_adaptation
    note: Adapt the target repository's rules, product paths and acceptance commands.
  - path: .agents/skills/shared/template-upgrade/
    scope: shared_with_adaptation
    note: Adapt current and target release tags, local conflicts and migration evidence.
  - path: .agents/skills/shared/release-doc-audit/
    scope: shared_with_adaptation
    note: Write and visually review standalone release narratives; adapt audience/type, repository URL, publication surface/image hosting, release-note ownership and RELEASE_HEADING. Includes shared release-type references; project examples stay outside this package. Preserve version, registry, path and machine-readable upgrade checks.
  - path: .agents/skills/shared/asset-lifecycle/
    scope: shared_with_adaptation
    note: Adapt asset classes, storage roots and migration evidence.
  - path: .agents/skills/shared/credential-setup/
    scope: shared
    optional: true
    note: Steps that apply llm-credentials (link the shared file, log in once per canonical checkout, safe re-login, hand over by name, no values in outputs, worktree login links); adopt or reject it with llm-credentials. Its parameters and the project's additions to its steps go in llm-credentials' own section.
  - path: .agents/memory/
    scope: shared_with_adaptation
    note: Keep the directory rules and indexes; destination records belong under shared/ or project/.
  - path: .agents/memory/shared/
    scope: shared
    note: Reusable durable decisions; adapt paths and commands before reuse.
  - path: .agents/memory/shared/docker-objects-prefixed-and-removed.md
    scope: shared_with_adaptation
    optional: true
    note: Fill DOCKER_PREFIX; every Docker object the project makes carries it and expired ones are removed promptly, only the project's own and never with -f; unnecessary for a project that uses no containers.
  - path: .agents/memory/shared/host-files-owned-by-running-user.md
    scope: shared
    note: Files, logs, caches and mounted output the project leaves on the host belong to the running user; no sudo for project files, and cleanup that meets foreign-owned files stops and reports.
  - path: .agents/memory/shared/issue-in-herdr-worktree.md
    scope: shared
    note: Each Issue runs in its own Herdr worktree and agent session under the handoff's working rules; applies to repositories developing from a dev branch.
  - path: .agents/memory/shared/issue-close-out.md
    scope: shared
    note: Close out the worktree after the PR merges; keep the project's own archive and stop commands in the issue-workflow slots.
  - path: .agents/memory/shared/issue-dispatch-by-difficulty.md
    scope: shared
    note: Dispatch each Issue agent with an explicit agent kind, provider, model and effort per difficulty tier and record it in the Issue; the cheapest source and model is the default, and every fallback or re-dispatch keeps its reason.
  - path: .agents/memory/shared/llm-credentials.md
    scope: shared_with_adaptation
    optional: true
    note: Fill SHARED_CREDENTIAL_FILE from user-level configuration and CREDENTIAL_DIR (credentials) under the canonical checkout's .project/; worktrees link to it; never copy a login between projects or worktrees; credentials pass by variable name or the tool's own channel, never as command-line arguments. The device's inventory.yaml beside the shared file names every variable, and the project's credentials.yaml names the rows it needs. The record holds the decisions; the steps are the credential-setup skill and the file formats and probes the credential-inventory knowledge record.
  - path: .agents/memory/shared/look-at-the-artifact-before-concluding.md
    scope: shared
    note: Before reporting a generated or evaluated result, look at the artifacts next to their references; automatic checks and cross-checks are leads, not evidence; when they disagree suspect the metric, and name what was looked at.
  - path: .agents/memory/shared/product-state-root.md
    scope: shared_with_adaptation
    note: Fill STATE_MARKER, STATE_ENV and DEFAULT_ROOT; product commands resolve a worktree's state root from the setup marker, and the lookup stops at the repository boundary.
  - path: .agents/memory/shared/project-positioning-before-layout.md
    scope: shared
    note: Establish users, deliverables, concepts and non-goals before mapping paths and reading directory contracts; product concepts govern layout, and adaptation cannot authorize a conflict.
  - path: .agents/memory/shared/provider-cost-routing.md
    scope: shared
    note: Ordinary tests and mechanical work use the cheapest token source and model that can judge them; a cheap run is still a real provider-backed run and never replaces a capability check; agent, provider, model and effort are explicit and recorded with what the run proves.
  - path: .agents/memory/shared/resolve-real-paths-before-moving.md
    scope: shared
    note: Before moving, replacing or symlinking a directory, prove source and destination are two different places and data sets, and let a person choose what to delete; the checks are in asset-lifecycle.
  - path: .agents/memory/shared/run-settings-from-config.md
    scope: shared_with_adaptation
    note: Fill CONFIG_FILE, COMMAND_TABLE, RECORD_FIELD and CONFIG_FLAG; run parameters are settings with a fixed override order, recorded at run start and reused on resume.
  - path: .agents/memory/shared/screen-with-scriptable-fakes.md
    scope: shared
    note: Screen boundary failure paths with one scriptable fake (scenarios as data, requests recorded with credentials masked by key name) before a real run; it is a sieve, not acceptance, and stays out of the product tree and image.
  - path: .agents/memory/shared/serve-the-coding-agent.md
    scope: shared_with_adaptation
    optional: true
    note: Fill GUIDANCE, COMMANDS, ISOLATION, TRACE and ACCOUNTING for where the project's instructions and acceptance criteria live, which commands the coding agent calls, what keeps each run apart, where the run records are read, and where usage is recorded and the budget stops a run; the five pillars (guidance, tools, parallelism, trace, cost) are a review lens, not a feature list, and the parallelism part links speed-and-parallelism-by-measurement instead of repeating it; unnecessary for a project not built on a coding agent.
  - path: .agents/memory/shared/speed-and-parallelism-by-measurement.md
    scope: shared
    note: Independent work runs in parallel and only a real dependency queues; concurrency is set from measured resources and provider health and reported apart from wall clock and cost; remove repeated work, never a check or a spending limit.
  - path: .agents/memory/shared/third-party-llm-compat-patches.md
    scope: shared_with_adaptation
    optional: true
    note: Fill PATCH_DIR for the project's patches or wrappers of third-party LLM tools; they run on every run and state that metrics, prompts and reasoning effort are unchanged.
  - path: .agents/memory/project/
    scope: project
    note: Decisions owned by the destination repository; never copy wholesale.
  - path: .agents/memory/ENTRY_TEMPLATE.md
    scope: shared
    note: Reusable record shape; keep the destination source and scope accurate.
  - path: .agents/knowledge/
    scope: shared_with_adaptation
    note: Keep the directory rules and indexes; destination facts belong under shared/ or project/.
  - path: .agents/knowledge/shared/
    scope: shared
    note: Reusable sourced facts with a refresh condition; adapt sources before reuse.
  - path: .agents/knowledge/shared/agent-session-messaging.md
    scope: shared
    note: Dated Claude native messaging/version/tool facts, Codex and Claude naming sources, and an observed Codex first-turn queue failure; refresh before relying on changed client behavior.
  - path: .agents/knowledge/shared/gpt5-strict-backend-requests.md
    scope: shared
    optional: true
    note: Dated GPT-5.x request shapes that strict Responses backends reject; recheck against the backend when a provider or a named client changes, and adapt the source before reuse.
  - path: .agents/knowledge/shared/credential-inventory.md
    scope: shared
    optional: true
    note: Formats of the device inventory.yaml and the project's credentials.yaml, and what probe-credentials.sh checks and prints; adopt or reject it with llm-credentials, and recheck it when those scripts change.
  - path: .agents/knowledge/project/
    scope: project
    note: Machine, provider, version and benchmark facts owned by the destination.
  - path: .agents/knowledge/ENTRY_TEMPLATE.md
    scope: shared
    note: Reusable record shape; keep the destination source, scope and refresh condition accurate.
  - path: .agents/skills/
    scope: project
    note: The directory is reusable as a layout; its non-shared contents are local.
  - path: .agents/**/AGENTS.md
    scope: shared_with_adaptation
    note: Keep the uniform directory guardrails, then adapt wording to the destination.
  - path: .agents/content-registry.yaml
    scope: shared_with_adaptation
    note: Rewrite entries as the destination project grows; do not copy template history. Keep the template block; template.upstream appears only in a derived template, and a project made from one records only that template. The writing block holds the project's own writing conventions (issue-workflow) or is left out; template-upgrade never changes it.
  - path: RELEASE_NOTES.md
    scope: template
    note: Template release history stays in the template repository; downstream projects keep their own release notes.
  - path: RELEASE_EXAMPLE.md
    scope: template
    note: Chinese project-specific draft for v0.1.20 through PR 114; a human-facing example, not release history or downstream shared guidance.
  - path: .github/release-examples/
    scope: template
    note: Small versioned diagram source and static image for RELEASE_EXAMPLE.md; human documentation assets, not product inputs or downstream payload.
  - path: .agents/skills/template-harvest/
    scope: template
    note: Maintainer procedure that collects settled downstream practice; keep it in the template repository and never copy it downstream.
  - path: .agents/tests/test_template_*.py
    scope: template
    note: The template's own tests of its scripts, run by its CI; never copied downstream.
  - path: .agents/scripts/
    scope: shared_with_adaptation
    note: Adopt the template's scripts unchanged and preserve lifecycle boundaries; put project setup in setup-project.sh and the teardown rules for the .project/ entries it creates in migrate-project.rules, which the template never ships.
  - path: .github/workflows/template-check.yml
    scope: shared_with_adaptation
    optional: true
    note: Hosted CI for the template checks. Adopt it when the issue-workflow <CI> slot is yes; leave it out when it is no, and template-upgrade keeps it out. Its result is noted on the PR and never gates a merge; the gate is the issue-workflow <LOCAL_CHECK>, which runs the same steps locally.
  - path: .project/
    scope: project
    note: Worktree-local state is never copied into a new repository template.
  - path: assets/MANIFEST.yaml
    scope: shared_with_adaptation
    note: Keep the schema, then register the destination project's actual assets.
  - path: pyproject.toml
    scope: shared_with_adaptation
    optional: true
    note: Replace project metadata and dependencies; keep the package boundary under the product tree (src/ by default).
  - path: Dockerfile
    scope: shared_with_adaptation
    optional: true
    note: Replace the base image and entrypoint; keep development-plane files out of the build context.
  - path: install.sh
    scope: shared_with_adaptation
    optional: true
    note: Replace the installation policy and retain a stable public installer entrypoint.
  - path: .dockerignore
    scope: shared_with_adaptation
    optional: true
    note: Adapt product inputs but keep .agents, .project and agent instruction files excluded.
