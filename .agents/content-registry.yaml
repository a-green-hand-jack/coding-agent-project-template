schema_version: 2
purpose: "Record which development-plane content is reusable across repositories and which content belongs to one concrete project."
template:
  repository: https://github.com/a-green-hand-jack/coding-agent-project-template
  version: v0.1.25
writing:
  language: "中文"
  issue_sections: "最终目标, 实现哲学, 现状和问题, 怎么办, 验收, 不做"
default_scope: project
matching: "Most specific path wins; explicit entries override directory defaults."
classes: {
    "shared": {
      "meaning": "Generic process that can be reused across projects.",
      "rule": "Reuse only after checking adaptation notes and local tool availability."
    },
    "shared_with_adaptation": {
      "meaning": "Reusable structure whose paths, commands or evidence must change.",
      "rule": "Copy skills and memory records verbatim and write the destination's slot values and step additions only in their trailing `## In this repository` section (template-adoption step 5), so template-upgrade replaces the text above it; copy other files selectively and rewrite them for the destination project."
    },
    "project": {
      "meaning": "Content about one project's product, environment or history.",
      "rule": "Create independently; never copy the directory wholesale."
    },
    "template": {
      "meaning": "Content that defines this template itself.",
      "rule": "Keep in the template repository only."
    }
  }
managed: [
    ".agents/"
  ]
policy: {
    "categories": [
      "execution",
      "tests",
      "memory",
      "knowledge",
      "skills",
      "scripts"
    ],
    "root_files": [
      "AGENTS.md",
      "CLAUDE.md",
      "content-registry.yaml"
    ],
    "category_files": {
      "memory": [
        "entry-template.md"
      ],
      "knowledge": [
        "entry-template.md"
      ]
    },
    "naming_exceptions": [
      {
        "pattern": "AGENTS.md",
        "reason": "Standard entrypoint or established external format."
      },
      {
        "pattern": "CLAUDE.md",
        "reason": "Standard entrypoint or established external format."
      },
      {
        "pattern": "SKILL.md",
        "reason": "Standard entrypoint or established external format."
      },
      {
        "pattern": "README.md",
        "reason": "Standard entrypoint or established external format."
      },
      {
        "pattern": "USER.md",
        "reason": "Standard entrypoint or established external format."
      },
      {
        "pattern": "DEV.md",
        "reason": "Standard entrypoint or established external format."
      },
      {
        "pattern": "LICENSE",
        "reason": "Standard entrypoint or established external format."
      },
      {
        "pattern": "Dockerfile",
        "reason": "Standard entrypoint or established external format."
      },
      {
        "pattern": "Containerfile",
        "reason": "Standard entrypoint or established external format."
      },
      {
        "pattern": "MANIFEST.yaml",
        "reason": "Standard entrypoint or established external format."
      },
      {
