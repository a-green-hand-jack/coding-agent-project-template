name: Bug
description: Report an observed defect with evidence
body:
  - type: markdown
    attributes:
      value: >-
        Write in the repository's declared language, and start the body with the
        declared `issue_sections` (最终目标、实现哲学、现状和问题、怎么办、验收、不做) in
        `.agents/content-registry.yaml`; the fields below are prompts for that
        body, not a replacement for it. The common principles are in the
        [development writing guide](https://github.com/a-green-hand-jack/coding-agent-project-template/blob/dev/.agents/skills/shared/development-writing/SKILL.md).
        Explain the trigger and consequence before diagnostic details; scale the
        detail to the defect.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, with the command or user path that triggered it?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and environment
      description: Include the checked version/head, command, conditions, result and redacted artifacts. Keep historical results distinct from new checks; never include secrets or private machine paths.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: What observable result and check establish the fix? Define conditional real-run requirements rather than assuming they are optional.
    validations:
      required: true
