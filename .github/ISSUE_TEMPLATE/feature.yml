name: Feature
description: Propose a bounded product or development change
body:
  - type: markdown
    attributes:
      value: >-
        Write in the repository's declared language, and start the body with the
        declared `issue_sections` (最终目标、实现哲学、现状和问题、怎么办、验收、不做) in
        `.agents/content-registry.yaml`; the fields below are prompts for that
        body, not a replacement for it. The common principles are in the
        [development writing guide](https://github.com/a-green-hand-jack/coding-agent-project-template/blob/dev/.agents/skills/shared/development-writing/SKILL.md).
        Keep the body understandable without links; use links for evidence.
        Scale the detail to the problem.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and design
      description: What is in scope, and what is deliberately outside it?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Which entrypoint, conditions and expected evidence establish completion? Define when any conditional real run is required; do not silently remove an unresolved requirement.
    validations:
      required: true
